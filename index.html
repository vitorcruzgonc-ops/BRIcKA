
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRICKA - Pedidos</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .lanches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .lanche {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .lanche h2 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .botoes-lanche {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-completo,
    .btn-personalizar,
    .btn-adicionar {
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
    }

    .btn-completo {
      background: #16803c;
      color: white;
    }

    .btn-completo:hover {
      background: #0f632e;
    }

    .btn-personalizar {
      background: #e8e8e8;
      color: #222;
    }

    .btn-personalizar:hover {
      background: #d5d5d5;
    }

    .btn-adicionar {
      background: #1769aa;
      color: white;
    }

    .btn-adicionar:hover {
      background: #0d4f82;
    }

    .ingredientes {
      margin-top: 20px;
    }

    .ingrediente {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #eee;
      cursor: pointer;
      transition: 0.2s;
    }

    .ingrediente:hover {
      transform: scale(1.01);
    }

    .ingrediente.ativo {
      background: #d8f5d8;
    }

    .ingrediente.removido {
      background: #ffdada;
      color: #777;
      text-decoration: line-through;
    }

    .ingrediente span {
      font-size: 16px;
    }

    .status {
      font-size: 13px !important;
      font-weight: bold;
      text-align: right;
    }

    .ativo .status {
      color: green;
    }

    .removido .status {
      color: red;
    }

    .resumo {
      background: white;
      margin-top: 35px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    .resumo h2 {
      margin-top: 0;
    }

    .item-pedido {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .item-pedido h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .item-pedido p {
      margin: 5px 0;
      line-height: 1.6;
    }

    .controles {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-controle {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 18px;
      font-weight: bold;
      background: #ddd;
    }

    .btn-remover {
      border: none;
      border-radius: 8px;
      padding: 10px;
      background: #c62828;
      color: white;
      font-weight: bold;
    }

    .btn-editar {
      border: none;
      border-radius: 8px;
      padding: 10px;
      background: #1769aa;
      color: white;
      font-weight: bold;
    }

    .quantidade {
      font-weight: bold;
      font-size: 18px;
    }

    #resumoIngredientes {
      line-height: 1.8;
    }

    .area-envio {
      margin-top: 35px;
      text-align: center;
    }

    #enviarPedido {
      width: 100%;
      max-width: 500px;
      padding: 18px;
      border: none;
      border-radius: 10px;
      background: #16803c;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #enviarPedido:hover {
      background: #0f632e;
      transform: scale(1.02);
    }

    #enviarPedido:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    #mensagem {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
      display: none;
    }

    .sucesso {
      display: block !important;
      background: #d8f5d8;
      color: #146b14;
    }

    .erro {
      display: block !important;
      background: #ffdada;
      color: #8a1111;
    }

    .aviso {
      display: block !important;
      background: #fff3cd;
      color: #856404;
    }

    .contador {
      text-align: center;
      font-weight: bold;
      color: #555;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      header h1 {
        font-size: 26px;
      }

      .lanche {
        padding: 20px;
      }

    }

  </style>

</head>

<body>

  <header>

    <h1>BRICKA</h1>

    <p>Monte seu lanche do seu jeito!</p>

  </header>


  <main class="container">

    <div class="contador" id="contadorCarrinho">
      🛒 Lanches no pedido: 0
    </div>


    <div class="lanches" id="listaLanches"></div>


    <div class="resumo">

      <h2>📝 Resumo do pedido</h2>

      <div id="listaResumo">

        Nenhum lanche adicionado.

      </div>

    </div>


    <div class="area-envio">

      <button id="enviarPedido" disabled>
        ENVIAR PEDIDO
      </button>

      <div id="mensagem"></div>

    </div>

  </main>


  <script type="module">


    // ==========================================
    // FIREBASE
    // ==========================================

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      set
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";


    // ==========================================
    // CONFIGURAÇÃO FIREBASE
    // ==========================================

    const firebaseConfig = {

      apiKey: "SUA_API_KEY",

      authDomain:
        "bricka-96d91.firebaseapp.com",

      databaseURL:
        "https://bricka-96d91-default-rtdb.firebaseio.com",

      projectId:
        "bricka-96d91",

      storageBucket:
        "bricka-96d91.firebasestorage.app",

      messagingSenderId:
        "503488792733",

      appId: "SEU_APP_ID"

    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // ==========================================
    // LANCHES
    // ==========================================

    const lanches = {

      "x-salada": {
        nome: "X-SALADA",
        emoji: "🍔",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Queijo",
          "Presunto",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-bacon": {
        nome: "X-BACON",
        emoji: "🥓",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Queijo",
          "Bacon",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-frango": {
        nome: "X-FRANGO",
        emoji: "🍗",
        ingredientes: [
          "Pão",
          "Frango",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-egg": {
        nome: "X-EGG",
        emoji: "🍳",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Ovo",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-calabresa": {
        nome: "X-CALABRESA",
        emoji: "🌭",
        ingredientes: [
          "Pão",
          "Calabresa",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-tudo": {
        nome: "X-TUDO",
        emoji: "🍔",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Bacon",
          "Presunto",
          "Ovo",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      }

    };


    // ==========================================
    // ESTADO DO CARRINHO
    // ==========================================

    let carrinho = [];

    let lancheEmEdicao = null;


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const listaLanches =
      document.getElementById("listaLanches");

    const listaResumo =
      document.getElementById("listaResumo");

    const contadorCarrinho =
      document.getElementById("contadorCarrinho");

    const enviarButton =
      document.getElementById("enviarPedido");

    const mensagem =
      document.getElementById("mensagem");


    // ==========================================
    // REMOVER ACENTOS
    // ==========================================

    function removerAcentos(texto) {

      return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    }


    // ==========================================
    // CRIAR CARDS
    // ==========================================

    function criarCards() {

      listaLanches.innerHTML = "";

      Object.keys(lanches).forEach(chave => {

        const lanche = lanches[chave];

        const card = document.createElement("div");

        card.className = "lanche";


        const titulo = document.createElement("h2");

        titulo.textContent =
          `${lanche.emoji} ${lanche.nome}`;

        card.appendChild(titulo);


        const botoes =
          document.createElement("div");

        botoes.className = "botoes-lanche";


        // BOTÃO LANCHE COMPLETO

        const botaoCompleto =
          document.createElement("button");

        botaoCompleto.className = "btn-completo";

        botaoCompleto.textContent =
          "✓ ADICIONAR COMPLETO";

        botaoCompleto.addEventListener("click", () => {

          adicionarLanche(
            chave,
            [...lanches[chave].ingredientes]
          );

        });


        // BOTÃO PERSONALIZAR

        const botaoPersonalizar =
          document.createElement("button");

        botaoPersonalizar.className =
          "btn-personalizar";

        botaoPersonalizar.textContent =
          "⚙ PERSONALIZAR LANCHE";

        botaoPersonalizar.addEventListener("click", () => {

          iniciarPersonalizacao(chave);

        });


        botoes.appendChild(botaoCompleto);

        botoes.appendChild(botaoPersonalizar);

        card.appendChild(botoes);


        // INGREDIENTES

        const ingredientesDiv =
          document.createElement("div");

        ingredientesDiv.className = "ingredientes";

        ingredientesDiv.id =
          `ingredientes-${chave}`;

        card.appendChild(ingredientesDiv);


        listaLanches.appendChild(card);


        criarIngredientes(
          chave,
          ingredientesDiv
        );

      });

    }


    // ==========================================
    // CRIAR INGREDIENTES
    // ==========================================

    function criarIngredientes(chave, elemento) {

      elemento.innerHTML = "";

      lanches[chave].ingredientes.forEach(ingrediente => {

        const div =
          document.createElement("div");

        div.className = "ingrediente";

        div.dataset.lanche = chave;

        div.dataset.ingrediente = ingrediente;

        div.innerHTML = `

          <span>${ingrediente}</span>

          <span class="status">
            NÃO SELECIONADO
          </span>

        `;


        div.addEventListener("click", () => {

          alternarIngredienteVisual(
            chave,
            ingrediente
          );

        });


        elemento.appendChild(div);

      });

    }


    // ==========================================
    // PERSONALIZAÇÃO TEMPORÁRIA
    // ==========================================

    function iniciarPersonalizacao(chave) {

      lancheEmEdicao = {

        chave: chave,

        ingredientes:
          [...lanches[chave].ingredientes]

      };


      atualizarVisualPersonalizacao(chave);

      mostrarMensagem(
        "Selecione os ingredientes e clique em ADICIONAR PERSONALIZADO.",
        "aviso"
      );


      const elemento =
        document.getElementById(`ingredientes-${chave}`);


      let botaoExistente =
        elemento.querySelector(".btn-adicionar");


      if (!botaoExistente) {

        const botao =
          document.createElement("button");

        botao.className = "btn-adicionar";

        botao.textContent =
          "➕ ADICIONAR PERSONALIZADO";

        botao.style.width = "100%";

        botao.style.marginTop = "10px";


        botao.addEventListener("click", () => {

          if (!lancheEmEdicao) {

            return;

          }


          adicionarLanche(
            lancheEmEdicao.chave,
            [...lancheEmEdicao.ingredientes]
          );


          lancheEmEdicao = null;

          botao.remove();

          mensagem.className = "";

          mensagem.textContent = "";

        });


        elemento.appendChild(botao);

      }

    }


    // ==========================================
    // VISUAL PERSONALIZAÇÃO
    // ==========================================

    function atualizarVisualPersonalizacao(chave) {

      document
        .querySelectorAll(
          `.ingrediente[data-lanche="${chave}"]`
        )
        .forEach(item => {

          const ingrediente =
            item.dataset.ingrediente;

          const selecionado =
            lancheEmEdicao &&
            lancheEmEdicao.chave === chave &&
            lancheEmEdicao.ingredientes.includes(ingrediente);


          item.classList.toggle(
            "ativo",
            selecionado
          );

          item.classList.toggle(
            "removido",
            !selecionado
          );


          const status =
            item.querySelector(".status");


          status.textContent =
            selecionado
              ? "✓ ADICIONADO"
              : "✕ REMOVIDO";

        });

    }


    // ==========================================
    // ALTERNAR INGREDIENTE
    // ==========================================

    function alternarIngredienteVisual(chave, ingrediente) {

      if (
        !lancheEmEdicao ||
        lancheEmEdicao.chave !== chave
      ) {

        iniciarPersonalizacao(chave);

      }


      const indice =
        lancheEmEdicao.ingredientes.indexOf(
          ingrediente
        );


      if (indice >= 0) {

        lancheEmEdicao.ingredientes.splice(
          indice,
          1
        );

      } else {

        lancheEmEdicao.ingredientes.push(
          ingrediente
        );

      }


      atualizarVisualPersonalizacao(chave);

    }


    // ==========================================
    // ADICIONAR LANCHE AO CARRINHO
    // ==========================================

    function adicionarLanche(chave, ingredientes) {

      const item = {

        id: Date.now() + Math.random(),

        chave: chave,

        produto: lanches[chave].nome,

        ingredientes: ingredientes

      };


      carrinho.push(item);


      atualizarResumo();

      atualizarContador();

    }


    // ==========================================
    // REMOVER ITEM
    // ==========================================

    function removerItem(id) {

      carrinho =
        carrinho.filter(item => item.id !== id);


      atualizarResumo();

      atualizarContador();

    }


    // ==========================================
    // DUPLICAR ITEM
    // ==========================================

    function duplicarItem(id) {

      const original =
        carrinho.find(item => item.id === id);


      if (!original) {

        return;

      }


      adicionarLanche(
        original.chave,
        [...original.ingredientes]
      );

    }


    // ==========================================
    // EDITAR ITEM DO CARRINHO
    // ==========================================

    function editarItem(id) {

      const item =
        carrinho.find(item => item.id === id);


      if (!item) {

        return;

      }


      lancheEmEdicao = {

        chave: item.chave,

        ingredientes: [...item.ingredientes]

      };


      atualizarVisualPersonalizacao(item.chave);


      const elemento =
        document.getElementById(
          `ingredientes-${item.chave}`
        );


      let botaoExistente =
        elemento.querySelector(".btn-adicionar");


      if (botaoExistente) {

        botaoExistente.remove();

      }


      const botao =
        document.createElement("button");

      botao.className = "btn-adicionar";

      botao.textContent =
        "✓ SALVAR ALTERAÇÕES";

      botao.style.width = "100%";

      botao.style.marginTop = "10px";


      botao.addEventListener("click", () => {

        const novosIngredientes =
          [...lancheEmEdicao.ingredientes];


        const indice =
          carrinho.findIndex(item => item.id === id);


        if (indice >= 0) {

          carrinho[indice].ingredientes =
            novosIngredientes;

        }


        lancheEmEdicao = null;

        botao.remove();

        atualizarResumo();

        atualizarContador();

        mensagem.className = "";

        mensagem.textContent = "";

      });


      elemento.appendChild(botao);


      window.scrollTo({

        top: elemento.offsetTop - 100,

        behavior: "smooth"

      });

    }


    // ==========================================
    // ATUALIZAR CONTADOR
    // ==========================================

    function atualizarContador() {

      contadorCarrinho.textContent =
        `🛒 Lanches no pedido: ${carrinho.length}`;

    }


    // ==========================================
    // ATUALIZAR RESUMO
    // ==========================================

    function atualizarResumo() {

      listaResumo.innerHTML = "";


      if (carrinho.length === 0) {

        listaResumo.textContent =
          "Nenhum lanche adicionado.";

        enviarButton.disabled = true;

        return;

      }


      carrinho.forEach((item, indice) => {

        const div =
          document.createElement("div");

        div.className = "item-pedido";


        const titulo =
          document.createElement("h3");

        titulo.textContent =
          `${indice + 1}. ${item.produto}`;

        div.appendChild(titulo);


        const ingredientes =
          document.createElement("p");

        ingredientes.innerHTML =
          "<strong>Ingredientes:</strong><br>" +
          (
            item.ingredientes.length > 0
              ? item.ingredientes
                  .map(ingrediente => `✓ ${ingrediente}`)
                  .join("<br>")
              : "Nenhum ingrediente"
          );

        div.appendChild(ingredientes);


        const controles =
          document.createElement("div");

        controles.className = "controles";


        // DUPLICAR

        const duplicar =
          document.createElement("button");

        duplicar.className = "btn-controle";

        duplicar.textContent = "➕";

        duplicar.title =
          "Adicionar outro igual";

        duplicar.addEventListener("click", () => {

          duplicarItem(item.id);

        });


        // QUANTIDADE

        const quantidade =
          document.createElement("span");

        quantidade.className = "quantidade";

        quantidade.textContent =
          "1 unidade";


        // EDITAR

        const editar =
          document.createElement("button");

        editar.className = "btn-editar";

        editar.textContent =
          "✏ EDITAR";

        editar.addEventListener("click", () => {

          editarItem(item.id);

        });


        // REMOVER

        const remover =
          document.createElement("button");

        remover.className = "btn-remover";

        remover.textContent =
          "🗑 REMOVER";

        remover.addEventListener("click", () => {

          removerItem(item.id);

        });


        controles.appendChild(duplicar);

        controles.appendChild(quantidade);

        controles.appendChild(editar);

        controles.appendChild(remover);


        div.appendChild(controles);

        listaResumo.appendChild(div);

      });


      enviarButton.disabled = false;

    }


    // ==========================================
    // MENSAGEM
    // ==========================================

    function mostrarMensagem(texto, tipo) {

      mensagem.textContent = texto;

      mensagem.className = tipo;

    }


    // ==========================================
    // ENVIAR PEDIDO
    // ==========================================

    enviarButton.addEventListener("click", async () => {

      if (carrinho.length === 0) {

        return;

      }


      enviarButton.disabled = true;

      enviarButton.textContent =
        "ENVIANDO...";


      mostrarMensagem(
        "Enviando pedido...",
        ""
      );


      // ========================================
      // PREPARAR PEDIDO
      // ========================================

      const pedido = {

        ativo: true,

        itens: carrinho.map(item => ({

          produto: removerAcentos(
            item.produto
          ),

          ingredientes:
            item.ingredientes.map(ingrediente =>
              removerAcentos(ingrediente)
            )

        }))

      };


      console.log(
        "Pedido que será enviado:",
        pedido
      );


      try {

        await set(
          ref(database, "pedido"),
          pedido
        );


        mostrarMensagem(
          "✓ Pedido enviado com sucesso!",
          "sucesso"
        );


        enviarButton.textContent =
          "PEDIDO ENVIADO";


        console.log(
          "Pedido enviado para o Firebase:",
          pedido
        );


      } catch (erro) {

        console.error(
          "Erro Firebase:",
          erro
        );


        mostrarMensagem(
          "✕ Erro ao enviar o pedido.",
          "erro"
        );


        enviarButton.disabled = false;

        enviarButton.textContent =
          "ENVIAR PEDIDO";

      }

    });


    // ==========================================
    // INICIALIZAR
    // ==========================================

    criarCards();

    atualizarResumo();

    atualizarContador();


  </script>

</body>

</html>
