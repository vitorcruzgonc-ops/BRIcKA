<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BRICkA - Pedidos</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    /* ==========================================
       ESCOLHA DO LANCHE
       ========================================== */

    .lanches {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(300px, 1fr)
      );

      gap: 25px;
    }

    .lanche {
      background: white;
      border-radius: 15px;
      padding: 25px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.12);
    }

    .lanche h2 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .ingredientes {
      margin-top: 20px;
    }

    /* ==========================================
       INGREDIENTES
       ========================================== */

    .ingrediente {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px;
      margin-bottom: 8px;

      border-radius: 8px;
      background: #eee;

      cursor: pointer;

      transition: 0.2s;
    }

    .ingrediente:hover {
      transform: scale(1.01);
    }

    .ingrediente.ativo {
      background: #d8f5d8;
    }

    .ingrediente.removido {
      background: #ffdada;
      color: #777;
      text-decoration: line-through;
    }

    .ingrediente span {
      font-size: 17px;
    }

    .status {
      font-size: 14px;
      font-weight: bold;
    }

    .ativo .status {
      color: green;
    }

    .removido .status {
      color: red;
    }

    /* ==========================================
       BOTÃO ENVIAR
       ========================================== */

    .area-envio {
      margin-top: 35px;
      text-align: center;
    }

    #enviarPedido {
      width: 100%;
      max-width: 500px;

      padding: 18px;

      border: none;
      border-radius: 10px;

      background: #16803c;
      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    #enviarPedido:hover {
      background: #0f632e;
      transform: scale(1.02);
    }

    #enviarPedido:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    /* ==========================================
       MENSAGEM
       ========================================== */

    #mensagem {
      margin-top: 20px;
      padding: 15px;

      text-align: center;

      border-radius: 10px;

      display: none;
    }

    .sucesso {
      display: block !important;
      background: #d8f5d8;
      color: #146b14;
    }

    .erro {
      display: block !important;
      background: #ffdada;
      color: #8a1111;
    }

    /* ==========================================
       PEDIDO ATUAL
       ========================================== */

    .resumo {
      background: white;
      margin-top: 35px;

      padding: 25px;

      border-radius: 15px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.10);
    }

    .resumo h2 {
      margin-top: 0;
    }

    #resumoIngredientes {
      line-height: 1.8;
    }

    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      header h1 {
        font-size: 26px;
      }

    }

  </style>

</head>


<body>

  <!-- ==========================================
       CABEÇALHO
       ========================================== -->

  <header>

    <h1>BRICkA</h1>

    <p>
      Monte seu lanche
    </p>

  </header>


  <main class="container">

    <!-- ========================================
         LANCHES
         ======================================== -->

    <div class="lanches">


      <!-- ======================================
           X-SALADA
           ====================================== -->

      <div class="lanche">

        <h2>🍔 X-SALADA</h2>

        <div
          class="ingredientes"
          id="ingredientesXSalada"
        ></div>

      </div>


      <!-- ======================================
           X-BACON
           ====================================== -->

      <div class="lanche">

        <h2>🥓 X-BACON</h2>

        <div
          class="ingredientes"
          id="ingredientesXBacon"
        ></div>

      </div>

    </div>


    <!-- ========================================
         RESUMO
         ======================================== -->

    <div class="resumo">

      <h2>
        📝 Resumo do pedido
      </h2>

      <p>
        <strong>Lanche:</strong>

        <span id="resumoLanche">
          Nenhum selecionado
        </span>
      </p>

      <p>
        <strong>Ingredientes:</strong>
      </p>

      <div id="resumoIngredientes">
        Selecione um lanche.
      </div>

    </div>


    <!-- ========================================
         ENVIO
         ======================================== -->

    <div class="area-envio">

      <button
        id="enviarPedido"
        disabled
      >
        ENVIAR PEDIDO
      </button>

      <div id="mensagem"></div>

    </div>

  </main>


  <!-- ==========================================
       FIREBASE
       ========================================== -->

  <script type="module">

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      set
    }
    from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";


    // ==========================================
    // CONFIGURAÇÃO FIREBASE
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyDg_CLZbu0my0pjYUSKTUmteNVD1sWDA",

      authDomain:
        "bricka-96d91.firebaseapp.com",

      databaseURL:
        "https://bricka-96d91-default-rtdb.firebaseio.com",

      projectId:
        "bricka-96d91",

      storageBucket:
        "bricka-96d91.firebasestorage.app",

      messagingSenderId:
        "503488792733",

      appId:
        "1:503488792733:web:3fb5ae349d09e82478cfec",

      measurementId:
        "G-8ZX1JPTR7W"
    };


    // ==========================================
    // INICIALIZAR FIREBASE
    // ==========================================

    const app =
      initializeApp(firebaseConfig);


    const database =
      getDatabase(app);


    // ==========================================
    // INGREDIENTES
    // ==========================================

    const lanches = {

      "x-salada": [

        "Pão",
        "Hambúrguer",
        "Queijo",
        "Presunto",
        "Alface",
        "Tomate",
        "Milho",
        "Batata palha",
        "Molho"

      ],

      "x-bacon": [

        "Pão",
        "Hambúrguer",
        "Queijo",
        "Bacon",
        "Alface",
        "Tomate",
        "Milho",
        "Batata palha",
        "Molho"

      ]

    };


    // ==========================================
    // ESTADO DO PEDIDO
    // ==========================================

    let lancheSelecionado =
      null;


    let ingredientesSelecionados =
      [];


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const enviarButton =
      document.getElementById(
        "enviarPedido"
      );


    const mensagem =
      document.getElementById(
        "mensagem"
      );


    // ==========================================
    // CRIAR INGREDIENTES
    // ==========================================

    function criarIngredientes(
      lanche,
      elemento
    ) {

      elemento.innerHTML = "";


      lanches[lanche].forEach(
        ingrediente => {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "ingrediente ativo";


          div.innerHTML = `

            <span>
              ${ingrediente}
            </span>

            <span class="status">
              ✓ ADICIONADO
            </span>

          `;


          div.addEventListener(
            "click",
            () => {

              alternarIngrediente(
                lanche,
                ingrediente,
                div
              );

            }
          );


          elemento.appendChild(div);

        }
      );

    }


    // ==========================================
    // ALTERNAR INGREDIENTE
    // ==========================================

    function alternarIngrediente(
      lanche,
      ingrediente,
      elemento
    ) {

      // ========================================
      // SE NÃO HÁ LANCHE SELECIONADO
      // ========================================

      if (
        lancheSelecionado !== lanche
      ) {

        selecionarLanche(lanche);

      }


      // ========================================
      // INGREDIENTE JÁ EXISTE
      // ========================================

      const indice =
        ingredientesSelecionados.indexOf(
          ingrediente
        );


      if (
        indice >= 0
      ) {

        // REMOVE

        ingredientesSelecionados.splice(
          indice,
          1
        );

        elemento.classList.remove(
          "ativo"
        );

        elemento.classList.add(
          "removido"
        );

        elemento.querySelector(
          ".status"
        ).textContent =
          "✕ REMOVIDO";

      }

      else {

        // ADICIONA

        ingredientesSelecionados.push(
          ingrediente
        );

        elemento.classList.remove(
          "removido"
        );

        elemento.classList.add(
          "ativo"
        );

        elemento.querySelector(
          ".status"
        ).textContent =
          "✓ ADICIONADO";

      }


      atualizarResumo();

    }


    // ==========================================
    // SELECIONAR LANCHE
    // ==========================================

    function selecionarLanche(
      lanche
    ) {

      lancheSelecionado =
        lanche;


      // Todos os ingredientes começam
      // adicionados

      ingredientesSelecionados =
        [...lanches[lanche]];


      // ========================================
      // ATUALIZAR VISUAL
      // ========================================

      document
        .querySelectorAll(
          ".ingrediente"
        )
        .forEach(
          item => {

            item.classList.remove(
              "removido"
            );

            item.classList.add(
              "ativo"
            );

            const status =
              item.querySelector(
                ".status"
              );

            if (status) {

              status.textContent =
                "✓ ADICIONADO";

            }

          }
        );


      atualizarResumo();

    }


    // ==========================================
    // ATUALIZAR RESUMO
    // ==========================================

    function atualizarResumo() {

      const resumoLanche =
        document.getElementById(
          "resumoLanche"
        );


      const resumoIngredientes =
        document.getElementById(
          "resumoIngredientes"
        );


      if (
        !lancheSelecionado
      ) {

        resumoLanche.textContent =
          "Nenhum selecionado";

        resumoIngredientes.textContent =
          "Selecione um lanche.";

        enviarButton.disabled =
          true;

        return;

      }


      resumoLanche.textContent =
        lancheSelecionado
          .toUpperCase();


      if (
        ingredientesSelecionados.length === 0
      ) {

        resumoIngredientes.innerHTML =
          "<strong>Nenhum ingrediente.</strong>";

      }

      else {

        resumoIngredientes.innerHTML =
          ingredientesSelecionados
            .map(
              ingrediente =>
                `✓ ${ingrediente}`
            )
            .join("<br>");

      }


      enviarButton.disabled =
        false;

    }


    // ==========================================
    // MOSTRAR MENSAGEM
    // ==========================================

    function mostrarMensagem(
      texto,
      tipo
    ) {

      mensagem.textContent =
        texto;

      mensagem.className =
        tipo;

    }


    // ==========================================
    // ENVIAR PEDIDO
    // ==========================================

    enviarButton.addEventListener(
      "click",
      async () => {

        if (
          !lancheSelecionado
        ) {

          return;

        }


        // ======================================
        // DESABILITAR BOTÃO
        // ======================================

        enviarButton.disabled =
          true;

        enviarButton.textContent =
          "ENVIANDO...";


        mostrarMensagem(
          "Enviando pedido...",
          ""
        );


        // ======================================
        // DADOS DO PEDIDO
        // ======================================

        const pedido = {

          ativo: true,

          produto:
            lancheSelecionado,

          ingredientes:
            ingredientesSelecionados

        };


        try {

          // ====================================
          // ENVIAR PARA FIREBASE
          // ====================================

          await set(
            ref(
              database,
              "pedido"
            ),
            pedido
          );


          // ====================================
          // SUCESSO
          // ====================================

          mostrarMensagem(
            "✓ Pedido enviado com sucesso!",
            "sucesso"
          );


          enviarButton.textContent =
            "PEDIDO ENVIADO";


          console.log(
            "Pedido enviado:",
            pedido
          );

        }

        catch (erro) {

          console.error(
            "Erro Firebase:",
            erro
          );


          mostrarMensagem(
            "✕ Erro ao enviar o pedido.",
            "erro"
          );


          enviarButton.disabled =
            false;

          enviarButton.textContent =
            "ENVIAR PEDIDO";

        }

      }
    );


    // ==========================================
    // INICIALIZAR TELAS
    // ==========================================

    criarIngredientes(
      "x-salada",
      document.getElementById(
        "ingredientesXSalada"
      )
    );


    criarIngredientes(
      "x-bacon",
      document.getElementById(
        "ingredientesXBacon"
      )
    );


  </script>

</body>

</html>
