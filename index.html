
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRICKA - Pedidos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .lanches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .lanche {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .lanche h2 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .botoes-lanche {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-completo,
    .btn-personalizar {
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-completo {
      background: #16803c;
      color: white;
    }

    .btn-completo:hover {
      background: #0f632e;
    }

    .btn-personalizar {
      background: #e8e8e8;
      color: #222;
    }

    .btn-personalizar:hover {
      background: #d5d5d5;
    }

    .ingredientes {
      margin-top: 20px;
    }

    .ingrediente {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #eee;
      cursor: pointer;
      transition: 0.2s;
    }

    .ingrediente:hover {
      transform: scale(1.01);
    }

    .ingrediente.ativo {
      background: #d8f5d8;
    }

    .ingrediente.removido {
      background: #ffdada;
      color: #777;
      text-decoration: line-through;
    }

    .ingrediente span {
      font-size: 16px;
    }

    .status {
      font-size: 13px !important;
      font-weight: bold;
      text-align: right;
    }

    .ativo .status {
      color: green;
    }

    .removido .status {
      color: red;
    }

    .resumo {
      background: white;
      margin-top: 35px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    .resumo h2 {
      margin-top: 0;
    }

    #resumoIngredientes {
      line-height: 1.8;
    }

    .area-envio {
      margin-top: 35px;
      text-align: center;
    }

    #enviarPedido {
      width: 100%;
      max-width: 500px;
      padding: 18px;
      border: none;
      border-radius: 10px;
      background: #16803c;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #enviarPedido:hover {
      background: #0f632e;
      transform: scale(1.02);
    }

    #enviarPedido:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    #mensagem {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
      display: none;
    }

    .sucesso {
      display: block !important;
      background: #d8f5d8;
      color: #146b14;
    }

    .erro {
      display: block !important;
      background: #ffdada;
      color: #8a1111;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      header h1 {
        font-size: 26px;
      }

      .lanche {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>BRICKA</h1>
    <p>Monte seu lanche do seu jeito!</p>
  </header>

  <main class="container">

    <div class="lanches" id="listaLanches"></div>

    <div class="resumo">

      <h2>📝 Resumo do pedido</h2>

      <p>
        <strong>Lanche:</strong>
        <span id="resumoLanche">Nenhum selecionado</span>
      </p>

      <p>
        <strong>Ingredientes:</strong>
      </p>

      <div id="resumoIngredientes">
        Selecione um lanche.
      </div>

    </div>

    <div class="area-envio">

      <button id="enviarPedido" disabled>
        ENVIAR PEDIDO
      </button>

      <div id="mensagem"></div>

    </div>

  </main>

  <script type="module">

    // ==========================================
    // FIREBASE
    // ==========================================

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      set
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";


    // ==========================================
    // CONFIGURAÇÃO DO FIREBASE
    // ==========================================

    const firebaseConfig = {

      apiKey: "SUA_API_KEY",

      authDomain:
        "bricka-96d91.firebaseapp.com",

      databaseURL:
        "https://bricka-96d91-default-rtdb.firebaseio.com",

      projectId:
        "bricka-96d91",

      storageBucket:
        "bricka-96d91.firebasestorage.app",

      messagingSenderId:
        "503488792733",

      appId: "SEU_APP_ID"

    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // ==========================================
    // LANCHES DISPONÍVEIS
    // ==========================================

    const lanches = {

      "x-salada": {
        nome: "X-SALADA",
        emoji: "🍔",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Queijo",
          "Presunto",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-bacon": {
        nome: "X-BACON",
        emoji: "🥓",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Queijo",
          "Bacon",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-frango": {
        nome: "X-FRANGO",
        emoji: "🍗",
        ingredientes: [
          "Pão",
          "Frango",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-egg": {
        nome: "X-EGG",
        emoji: "🍳",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Ovo",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-calabresa": {
        nome: "X-CALABRESA",
        emoji: "🌭",
        ingredientes: [
          "Pão",
          "Calabresa",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      },

      "x-tudo": {
        nome: "X-TUDO",
        emoji: "🍔",
        ingredientes: [
          "Pão",
          "Hambúrguer",
          "Bacon",
          "Presunto",
          "Ovo",
          "Queijo",
          "Alface",
          "Tomate",
          "Milho",
          "Batata palha",
          "Molho"
        ]
      }

    };


    // ==========================================
    // ESTADO
    // ==========================================

    let lancheSelecionado = null;

    let ingredientesSelecionados = [];


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const listaLanches =
      document.getElementById("listaLanches");

    const enviarButton =
      document.getElementById("enviarPedido");

    const mensagem =
      document.getElementById("mensagem");


    // ==========================================
    // REMOVER ACENTOS
    // ==========================================

    function removerAcentos(texto) {

      return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    }


    // ==========================================
    // CRIAR OS CARDS DOS LANCHES
    // ==========================================

    function criarCards() {

      listaLanches.innerHTML = "";

      Object.keys(lanches).forEach(chave => {

        const lanche = lanches[chave];

        const card = document.createElement("div");

        card.className = "lanche";

        const titulo = document.createElement("h2");

        titulo.textContent =
          `${lanche.emoji} ${lanche.nome}`;

        card.appendChild(titulo);


        const botoes = document.createElement("div");

        botoes.className = "botoes-lanche";


        // BOTÃO LANCHE COMPLETO

        const botaoCompleto =
          document.createElement("button");

        botaoCompleto.className = "btn-completo";

        botaoCompleto.textContent =
          "✓ LANCHE COMPLETO";

        botaoCompleto.addEventListener("click", () => {

          selecionarLancheCompleto(chave);

        });


        // BOTÃO PERSONALIZAR

        const botaoPersonalizar =
          document.createElement("button");

        botaoPersonalizar.className =
          "btn-personalizar";

        botaoPersonalizar.textContent =
          "⚙ PERSONALIZAR LANCHE";

        botaoPersonalizar.addEventListener("click", () => {

          selecionarLanchePersonalizado(chave);

        });


        botoes.appendChild(botaoCompleto);

        botoes.appendChild(botaoPersonalizar);

        card.appendChild(botoes);


        // INGREDIENTES

        const ingredientesDiv =
          document.createElement("div");

        ingredientesDiv.className = "ingredientes";

        ingredientesDiv.id =
          `ingredientes-${chave}`;

        card.appendChild(ingredientesDiv);


        listaLanches.appendChild(card);


        criarIngredientes(
          chave,
          ingredientesDiv
        );

      });

    }


    // ==========================================
    // CRIAR INGREDIENTES
    // ==========================================

    function criarIngredientes(chave, elemento) {

      elemento.innerHTML = "";

      lanches[chave].ingredientes.forEach(ingrediente => {

        const div =
          document.createElement("div");

        div.className = "ingrediente";

        div.dataset.lanche = chave;

        div.dataset.ingrediente = ingrediente;

        div.innerHTML = `

          <span>${ingrediente}</span>

          <span class="status">
            NÃO SELECIONADO
          </span>

        `;


        div.addEventListener("click", () => {

          alternarIngrediente(
            chave,
            ingrediente
          );

        });


        elemento.appendChild(div);

      });

    }


    // ==========================================
    // SELECIONAR LANCHE COMPLETO
    // ==========================================

    function selecionarLancheCompleto(chave) {

      lancheSelecionado = chave;

      ingredientesSelecionados =
        [...lanches[chave].ingredientes];


      atualizarVisualIngredientes();

      atualizarResumo();

    }


    // ==========================================
    // SELECIONAR LANCHE PERSONALIZADO
    // ==========================================

    function selecionarLanchePersonalizado(chave) {

      lancheSelecionado = chave;

      ingredientesSelecionados =
        [...lanches[chave].ingredientes];


      atualizarVisualIngredientes();

      atualizarResumo();

    }


    // ==========================================
    // ALTERNAR INGREDIENTE
    // ==========================================

    function alternarIngrediente(chave, ingrediente) {

      // Se clicar em ingrediente de outro lanche,
      // seleciona o novo lanche completo primeiro.

      if (lancheSelecionado !== chave) {

        lancheSelecionado = chave;

        ingredientesSelecionados =
          [...lanches[chave].ingredientes];

      }


      const indice =
        ingredientesSelecionados.indexOf(ingrediente);


      if (indice >= 0) {

        // REMOVER INGREDIENTE

        ingredientesSelecionados.splice(indice, 1);

      } else {

        // ADICIONAR INGREDIENTE

        ingredientesSelecionados.push(ingrediente);

      }


      atualizarVisualIngredientes();

      atualizarResumo();

    }


    // ==========================================
    // ATUALIZAR VISUAL DOS INGREDIENTES
    // ==========================================

    function atualizarVisualIngredientes() {

      document.querySelectorAll(".ingrediente").forEach(item => {

        const chave = item.dataset.lanche;

        const ingrediente = item.dataset.ingrediente;

        const selecionado =
          chave === lancheSelecionado &&
          ingredientesSelecionados.includes(ingrediente);


        item.classList.toggle("ativo", selecionado);

        item.classList.toggle("removido", !selecionado);


        const status = item.querySelector(".status");


        if (chave !== lancheSelecionado) {

          item.classList.remove("ativo", "removido");

          status.textContent = "NÃO SELECIONADO";

        } else if (selecionado) {

          status.textContent = "✓ ADICIONADO";

        } else {

          status.textContent = "✕ REMOVIDO";

        }

      });

    }


    // ==========================================
    // ATUALIZAR RESUMO
    // ==========================================

    function atualizarResumo() {

      const resumoLanche =
        document.getElementById("resumoLanche");

      const resumoIngredientes =
        document.getElementById("resumoIngredientes");


      if (!lancheSelecionado) {

        resumoLanche.textContent =
          "Nenhum selecionado";

        resumoIngredientes.textContent =
          "Selecione um lanche.";

        enviarButton.disabled = true;

        return;

      }


      resumoLanche.textContent =
        lanches[lancheSelecionado].nome;


      if (ingredientesSelecionados.length === 0) {

        resumoIngredientes.innerHTML =
          "<strong>Nenhum ingrediente.</strong>";

      } else {

        resumoIngredientes.innerHTML =
          ingredientesSelecionados
            .map(ingrediente => `✓ ${ingrediente}`)
            .join("<br>");

      }


      enviarButton.disabled = false;

    }


    // ==========================================
    // MENSAGEM
    // ==========================================

    function mostrarMensagem(texto, tipo) {

      mensagem.textContent = texto;

      mensagem.className = tipo;

    }


    // ==========================================
    // ENVIAR PEDIDO
    // ==========================================

    enviarButton.addEventListener("click", async () => {

      if (!lancheSelecionado) {

        return;

      }


      enviarButton.disabled = true;

      enviarButton.textContent = "ENVIANDO...";


      mostrarMensagem(
        "Enviando pedido...",
        ""
      );


      const pedido = {

        ativo: true,

        produto: removerAcentos(
          lanches[lancheSelecionado].nome
        ),

        ingredientes:
          ingredientesSelecionados.map(ingrediente =>
            removerAcentos(ingrediente)
          )

      };


      console.log(
        "Pedido que será enviado:",
        pedido
      );


      try {

        await set(
          ref(database, "pedido"),
          pedido
        );


        mostrarMensagem(
          "✓ Pedido enviado com sucesso!",
          "sucesso"
        );


        enviarButton.textContent =
          "PEDIDO ENVIADO";


        console.log(
          "Pedido enviado para o Firebase:",
          pedido
        );

      } catch (erro) {

        console.error(
          "Erro Firebase:",
          erro
        );


        mostrarMensagem(
          "✕ Erro ao enviar o pedido.",
          "erro"
        );


        enviarButton.disabled = false;

        enviarButton.textContent =
          "ENVIAR PEDIDO";

      }

    });


    // ==========================================
    // INICIALIZAR SITE
    // ==========================================

    criarCards();

  </script>

</body>

</html>
