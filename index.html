
<!DOCTYPE html>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 8px 0 0;
  color: #ccc;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px;
}

/* =========================
   ABAS
   ========================= */

.abas {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
  justify-content: center;
  flex-wrap: wrap;
}

.aba {
  border: none;
  border-radius: 10px;
  padding: 14px 25px;
  font-size: 17px;
  font-weight: bold;
  background: #ddd;
  color: #222;
  cursor: pointer;
}

.aba.ativa {
  background: #111;
  color: white;
}

.conteudo-aba {
  display: none;
}

.conteudo-aba.ativo {
  display: block;
}

/* =========================
   LANCHES
   ========================= */

.lanches {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

.lanche {
  background: white;
  border-radius: 15px;
  padding: 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

.lanche h2 {
  margin-top: 0;
  text-align: center;
  font-size: 26px;
}

.preco-lanche {
  text-align: center;
  font-size: 23px;
  font-weight: bold;
  color: #16803c;
  margin: 10px 0 20px;
}

.botoes-lanche {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  cursor: pointer;
  transition: 0.2s;
}

.btn-completo,
.btn-personalizar,
.btn-adicionar {
  border: none;
  border-radius: 8px;
  padding: 13px;
  font-size: 15px;
  font-weight: bold;
}

.btn-completo {
  background: #16803c;
  color: white;
}

.btn-personalizar {
  background: #e8e8e8;
  color: #222;
}

.btn-adicionar {
  background: #1769aa;
  color: white;
}

/* =========================
   INGREDIENTES
   ========================= */

.ingredientes {
  margin-top: 20px;
}

.ingrediente {
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 8px;
  background: #eee;
}

.ingrediente-topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.ingrediente.ativo {
  background: #d8f5d8;
}

.ingrediente.removido {
  background: #ffdada;
  color: #777;
  text-decoration: line-through;
}

.ingrediente-nome {
  font-size: 16px;
  font-weight: bold;
}

.status {
  font-size: 13px;
  font-weight: bold;
}

.ativo .status {
  color: green;
}

.removido .status {
  color: red;
}

/* =========================
   ADICIONAL
   ========================= */

.adicional-area {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #ccc;
}

.adicional-info {
  font-size: 13px;
  color: #555;
  margin-bottom: 8px;
}

.controle-adicional {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-extra {
  border: none;
  border-radius: 6px;
  padding: 7px 12px;
  background: #1769aa;
  color: white;
  font-weight: bold;
}

.btn-extra:hover {
  background: #0d4f82;
}

.qtd-extra {
  min-width: 35px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

/* =========================
   BEBIDAS
   ========================= */

.categoria-bebida {
  margin-bottom: 35px;
}

.categoria-bebida h2 {
  background: #111;
  color: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  text-align: center;
}

.bebidas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

.bebida {
  background: white;
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

.bebida .emoji {
  font-size: 45px;
}

.bebida h3 {
  margin: 5px 0;
}

.bebida .preco {
  font-size: 21px;
  font-weight: bold;
  color: #16803c;
  margin: 10px 0 15px;
}

.btn-bebida {
  width: 100%;
  border: none;
  border-radius: 8px;
  padding: 12px;
  background: #1769aa;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

/* =========================
   RESUMO
   ========================= */

.resumo {
  background: white;
  margin-top: 35px;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

.resumo h2 {
  margin-top: 0;
}

.item-pedido {
  background: #f5f5f5;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.item-pedido h3 {
  margin: 0 0 5px;
  font-size: 18px;
}

.tipo-item {
  font-size: 13px;
  color: #666;
  font-weight: bold;
}

.preco-item {
  font-size: 19px;
  font-weight: bold;
  color: #16803c;
  margin: 8px 0 12px;
}

.adicionais-resumo {
  margin-top: 8px;
  padding: 10px;
  background: #fff3cd;
  border-radius: 8px;
  font-size: 14px;
}

.controles {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.btn-controle {
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 18px;
  font-weight: bold;
  background: #ddd;
}

.btn-remover {
  border: none;
  border-radius: 8px;
  padding: 10px;
  background: #c62828;
  color: white;
  font-weight: bold;
}

.btn-editar {
  border: none;
  border-radius: 8px;
  padding: 10px;
  background: #1769aa;
  color: white;
  font-weight: bold;
}

/* =========================
   TOTAL
   ========================= */

.total-pedido {
  margin-top: 25px;
  padding: 20px;
  border-radius: 12px;
  background: #111;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#valorTotal {
  font-size: 28px;
  font-weight: bold;
  color: #7cff9b;
}

/* =========================
   ENVIO
   ========================= */

.area-envio {
  margin-top: 35px;
  text-align: center;
}

#enviarPedido {
  width: 100%;
  max-width: 500px;
  padding: 18px;
  border: none;
  border-radius: 10px;
  background: #16803c;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

#enviarPedido:disabled {
  background: #999;
}

#mensagem {
  margin-top: 20px;
  padding: 15px;
  text-align: center;
  border-radius: 10px;
  display: none;
}

.sucesso {
  display: block !important;
  background: #d8f5d8;
  color: #146b14;
}

.erro {
  display: block !important;
  background: #ffdada;
  color: #8a1111;
}

.aviso {
  display: block !important;
  background: #fff3cd;
  color: #856404;
}

.contador {
  text-align: center;
  font-weight: bold;
  color: #555;
  margin-bottom: 20px;
}

@media (max-width: 600px) {

  .container {
    padding: 15px;
  }

  header h1 {
    font-size: 26px;
  }

  .lanche {
    padding: 20px;
  }

  .total-pedido {
    flex-direction: column;
    text-align: center;
  }

}

</style>
</head>

<script type="module">

// ==========================================

const app = initializeApp(firebaseConfig);

// ==========================================

const lanches = {

// ==========================================

const bebidas = {

refrigerantes: [

sucos: [

},

{

emoji: "💧",

}

]

};


// ==========================================
// ESTADO
// ==========================================

let carrinho = [];

let lancheEmEdicao = null;


// ==========================================
// ELEMENTOS
// ==========================================

const listaLanches =
document.getElementById("listaLanches");

const listaResumo =
document.getElementById("listaResumo");

const contadorCarrinho =
document.getElementById("contadorCarrinho");

const enviarButton =
document.getElementById("enviarPedido");

const mensagem =
document.getElementById("mensagem");

const valorTotal =
document.getElementById("valorTotal");


// ==========================================
// PREÇO
// ==========================================

function formatarPreco(valor) {

return valor.toLocaleString("pt-BR", {

style: "currency",

currency: "BRL"

});

}


// ==========================================
// REMOVER ACENTOS
// ==========================================

function removerAcentos(texto) {

return texto
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "");

}


// ==========================================
// PREÇO DE UM ADICIONAL
// ==========================================

function precoAdicional(ingrediente) {

if (
ingrediente.toLowerCase() === "hambúrguer"
) {

return 3.00;

}

return 1.00;

}


// ==========================================
// CALCULAR PREÇO DOS ADICIONAIS
// ==========================================

function calcularAdicionais(item) {

if (!item.adicionais) {

return 0;

}

return item.adicionais.reduce(
(total, adicional) => {

return total +
(
precoAdicional(adicional.nome) *
adicional.quantidade
);

},
0
);

}


// ==========================================
// PREÇO TOTAL DO ITEM
// ==========================================

function calcularPrecoItem(item) {

return item.precoBase +
calcularAdicionais(item);

}


// ==========================================
// TOTAL DO PEDIDO
// ==========================================

function calcularTotal() {

return carrinho.reduce(
(total, item) => {

return total +
calcularPrecoItem(item);

},
0
);

}


// ==========================================
// ATUALIZAR TOTAL
// ==========================================

function atualizarTotal() {

valorTotal.textContent =
formatarPreco(calcularTotal());

}


// ==========================================
// ABAS
// ==========================================

document.querySelectorAll(".aba").forEach(botao => {

botao.addEventListener("click", () => {

const aba =
botao.dataset.aba;


document.querySelectorAll(".aba")
.forEach(aba => {

aba.classList.remove("ativa");

});


document.querySelectorAll(".conteudo-aba")
.forEach(conteudo => {

conteudo.classList.remove("ativo");

});


botao.classList.add("ativa");


document
.getElementById(`aba-${aba}`)
.classList.add("ativo");

});

});


// ==========================================
// CRIAR CARDS
// ==========================================

function criarCards() {

listaLanches.innerHTML = "";


Object.keys(lanches).forEach(chave => {

const lanche =
lanches[chave];


const card =
document.createElement("div");

card.className =
"lanche";


const titulo =
document.createElement("h2");

titulo.textContent =
`${lanche.emoji} ${lanche.nome}`;

card.appendChild(titulo);


const preco =
document.createElement("div");

preco.className =
"preco-lanche";

preco.textContent =
formatarPreco(lanche.preco);

card.appendChild(preco);


const botoes =
document.createElement("div");

botoes.className =
"botoes-lanche";


const completo =
document.createElement("button");

completo.className =
"btn-completo";

completo.textContent =
"✓ ADICIONAR COMPLETO";


completo.addEventListener("click", () => {

adicionarLanche(
chave,
[...lanche.ingredientes]
);

});


const personalizar =
document.createElement("button");

personalizar.className =
"btn-personalizar";

personalizar.textContent =
"⚙ PERSONALIZAR LANCHE";


personalizar.addEventListener("click", () => {

iniciarPersonalizacao(chave);

});


botoes.appendChild(completo);

botoes.appendChild(personalizar);

card.appendChild(botoes);


const ingredientes =
document.createElement("div");

ingredientes.className =
"ingredientes";

ingredientes.id =
`ingredientes-${chave}`;

card.appendChild(ingredientes);


listaLanches.appendChild(card);


criarIngredientes(
chave,
ingredientes
);

});

}


// ==========================================
// CRIAR INGREDIENTES
// ==========================================

function criarIngredientes(
chave,
elemento
) {

elemento.innerHTML = "";


lanches[chave].ingredientes
.forEach(ingrediente => {

const div =
document.createElement("div");

div.className =
"ingrediente";

div.dataset.lanche =
chave;

div.dataset.ingrediente =
ingrediente;


div.innerHTML = `

<div class="ingrediente-topo">

<span class="ingrediente-nome">
${ingrediente}
</span>

<span class="status">
NÃO SELECIONADO
</span>

</div>

<div class="adicional-area">

<div class="adicional-info">

Extra:
<strong>
${formatarPreco(
precoAdicional(ingrediente)
)}
</strong>

</div>

<div class="controle-adicional">

<button
class="btn-extra btn-menos"
type="button">
−
</button>

<span class="qtd-extra">
0
</span>

<button
class="btn-extra btn-mais"
type="button">
+
</button>

</div>

</div>

`;


div.querySelector(".btn-menos")
.addEventListener("click", evento => {

evento.stopPropagation();

alterarAdicionalVisual(
chave,
ingrediente,
-1
);

});


div.querySelector(".btn-mais")
.addEventListener("click", evento => {

evento.stopPropagation();

alterarAdicionalVisual(
chave,
ingrediente,
1
);

});


div.addEventListener("click", () => {

alternarIngredienteVisual(
chave,
ingrediente
);

});


elemento.appendChild(div);

});

}


// ==========================================
// INICIAR PERSONALIZAÇÃO
// ==========================================

function iniciarPersonalizacao(chave) {

lancheEmEdicao = {

chave: chave,

ingredientes:
[...lanches[chave].ingredientes],

adicionais: []

};


atualizarVisualPersonalizacao(chave);


mostrarMensagem(
"Selecione os ingredientes e adicione extras usando +.",
"aviso"
);


criarBotaoSalvarPersonalizacao(
chave
);

}


// ==========================================
// BOTÃO SALVAR PERSONALIZAÇÃO
// ==========================================

function criarBotaoSalvarPersonalizacao(chave) {

const elemento =
document.getElementById(
`ingredientes-${chave}`
);


let antigo =
elemento.querySelector(
".btn-adicionar"
);


if (antigo) {

antigo.remove();

}


const botao =
document.createElement("button");

botao.className =
"btn-adicionar";

botao.textContent =
"➕ ADICIONAR PERSONALIZADO";

botao.style.width =
"100%";

botao.style.marginTop =
"10px";


botao.addEventListener(
"click",
() => {

if (!lancheEmEdicao) {
return;
}


adicionarLanche(

lancheEmEdicao.chave,

[...lancheEmEdicao.ingredientes],

[...lancheEmEdicao.adicionais]

);


lancheEmEdicao = null;

botao.remove();

mensagem.className = "";

mensagem.textContent = "";

});

elemento.appendChild(botao);

}


// ==========================================
// ALTERNAR INGREDIENTE
// ==========================================

function alternarIngredienteVisual(
chave,
ingrediente
) {

if (
!lancheEmEdicao ||
lancheEmEdicao.chave !== chave
) {

iniciarPersonalizacao(chave);

}


const indice =
lancheEmEdicao.ingredientes.indexOf(
ingrediente
);


if (indice >= 0) {

lancheEmEdicao.ingredientes.splice(
indice,
1
);

} else {

lancheEmEdicao.ingredientes.push(
ingrediente
);

}


atualizarVisualPersonalizacao(chave);

}


// ==========================================
// ADICIONAR / REMOVER EXTRA
// ==========================================

function alterarAdicionalVisual(
chave,
ingrediente,
quantidade
) {

if (
!lancheEmEdicao ||
lancheEmEdicao.chave !== chave
) {

iniciarPersonalizacao(chave);

}


let adicional =
lancheEmEdicao.adicionais.find(
item =>
item.nome === ingrediente
);


if (!adicional) {

adicional = {

nome: ingrediente,

quantidade: 0

};

lancheEmEdicao.adicionais.push(
adicional
);

}


adicional.quantidade +=
quantidade;


if (adicional.quantidade < 0) {

adicional.quantidade = 0;

}


lancheEmEdicao.adicionais =
lancheEmEdicao.adicionais.filter(
item =>
item.quantidade > 0
);


atualizarVisualPersonalizacao(chave);

}


// ==========================================
// ATUALIZAR VISUAL
// ==========================================

function atualizarVisualPersonalizacao(chave) {

document
.querySelectorAll(
`.ingrediente[data-lanche="${chave}"]`
)
.forEach(item => {

const ingrediente =
item.dataset.ingrediente;


const selecionado =
lancheEmEdicao &&
lancheEmEdicao.chave === chave &&
lancheEmEdicao.ingredientes.includes(
ingrediente
);


item.classList.toggle(
"ativo",
selecionado
);

item.classList.toggle(
"removido",
!selecionado
);


const status =
item.querySelector(".status");


status.textContent =
selecionado
? "✓ INCLUÍDO"
: "✕ REMOVIDO";


const adicional =
lancheEmEdicao &&
lancheEmEdicao.adicionais.find(
item =>
item.nome === ingrediente
);


const quantidade =
adicional
? adicional.quantidade
: 0;


item.querySelector(
".qtd-extra"
).textContent =
quantidade;

});

}


// ==========================================
// ADICIONAR LANCHE
// ==========================================

function adicionarLanche(
chave,
ingredientes,
adicionais = []
) {

const item = {

id:
Date.now() + Math.random(),

tipo:
"lanche",

chave:
chave,

produto:
lanches[chave].nome,

precoBase:
lanches[chave].preco,

ingredientes:
ingredientes,

adicionais:
adicionais

};


carrinho.push(item);


atualizarResumo();

atualizarContador();

atualizarTotal();

}

// BEBIDAS
// ==========================================

function criarBebidas(
lista,
elementoId
) {

document.getElementById(elementoId);


elemento.innerHTML = "";


lista.forEach(bebida => {

document.createElement("div");

`;

// ADICIONAR BEBIDA
// ==========================================

function adicionarBebida(bebida) {

id:
Date.now() + Math.random(),

tipo:
"bebida",

produto:
bebida.nome,

precoBase:

adicionais: []

// ==========================================
// REMOVER ITEM
// ==========================================

function removerItem(id) {

carrinho =
carrinho.filter(
item =>
item.id !== id
);


atualizarResumo();

atualizarContador();

atualizarTotal();

}


// ==========================================
// DUPLICAR
// ==========================================

function duplicarItem(id) {

const original =
carrinho.find(
item =>
item.id === id
);


if (!original) {
return;
}


const copia = {

id:
Date.now() + Math.random(),

tipo:
original.tipo,

chave:
original.chave,

produto:
original.produto,

precoBase:
original.precoBase,

ingredientes:
[...original.ingredientes],

adicionais:
original.adicionais.map(
adicional => ({

nome:
adicional.nome,

quantidade:
adicional.quantidade

})
)

};


carrinho.push(copia);


atualizarResumo();

atualizarContador();

atualizarTotal();

}


// ==========================================
// EDITAR ITEM
// ==========================================

function editarItem(id) {

const item =
carrinho.find(
item =>
item.id === id
);


if (!item || item.tipo !== "lanche") {

return;

}


lancheEmEdicao = {

chave:
item.chave,

ingredientes:
[...item.ingredientes],

adicionais:
item.adicionais.map(
adicional => ({

nome:
adicional.nome,

quantidade:
adicional.quantidade

})
)

};


atualizarVisualPersonalizacao(
item.chave
);


criarBotaoSalvarEdicao(
item.id
);


window.scrollTo({

top:
document.getElementById(
`ingredientes-${item.chave}`
).offsetTop - 100,

behavior:
"smooth"

});

}


// ==========================================
// SALVAR EDIÇÃO
// ==========================================

function criarBotaoSalvarEdicao(id) {

const chave =
carrinho.find(
item =>
item.id === id
).chave;


const elemento =
document.getElementById(
`ingredientes-${chave}`
);


let antigo =
elemento.querySelector(
".btn-adicionar"
);


if (antigo) {
antigo.remove();
}


const botao =
document.createElement("button");

botao.className =
"btn-adicionar";

botao.textContent =
"✓ SALVAR ALTERAÇÕES";

botao.style.width =
"100%";

botao.style.marginTop =
"10px";


botao.addEventListener(
"click",
() => {

const indice =
carrinho.findIndex(
item =>
item.id === id
);


if (indice >= 0) {

carrinho[indice].ingredientes =
[...lancheEmEdicao.ingredientes];

carrinho[indice].adicionais =
[...lancheEmEdicao.adicionais];

}


lancheEmEdicao = null;

botao.remove();

atualizarResumo();

atualizarContador();

atualizarTotal();

mensagem.className = "";

mensagem.textContent = "";

});


elemento.appendChild(botao);

}
